apis:
- name: Miter REST API
  description: 'Miter exposes a REST API used to build custom integrations between the Miter HCM
    platform and construction ERPs, accounting, and workforce systems — syncing projects, cost codes,
    accounts, employees, time, and pay. The API is gated behind authentication (api.miter.com returns
    401 without credentials); Miter does not publish a public developer portal or OpenAPI definition,
    directing partners to build against the REST API via their account team.'
