aid: miter
name: Miter
description: 'Miter is a Human Capital Management (HCM) platform purpose-built for construction contractors,
  consolidating payroll, HR, benefits, field operations, and expense management into a single connected
  system. Its construction payroll automates prevailing-wage, certified-payroll, and union compliance,
  multi-state tax handling, and fully-burdened job-cost tracking in real time, while its HRIS covers
  recruiting, benefits, performance, and learning. Field Operations adds time tracking, scheduling,
  daily reports, production tracking, and safety, and Expense Management handles reimbursements,
  per diems, and corporate cards. Miter connects to construction ERPs and accounting systems (Sage
  Intacct, NetSuite, Acumatica, QuickBooks, Procore, Viewpoint, and more) through off-the-shelf
  integrations or a custom REST API. Backed by Bessemer Venture Partners.'
